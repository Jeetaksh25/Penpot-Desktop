[package]
name = "penpot-desktop"
version = "1.0.30"
description = "A powerful design and code generation tool"
authors = ["Penpot Desktop"]
edition = "2021"

[lib]
name = "penpot_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
# Outbound HTTP. `blocking` is used by the desktop proxy's TLS fetch of
# fonts.googleapis.com / fonts.gstatic.com (Feature 1) — it runs on a plain
# std thread, so it cannot use the async client (which panics inside a
# runtime). The async client is used by the AI layer (Foundation F4) via
# `#[tauri::command] async fn` on the tokio runtime. `rustls-tls` enables
# TLS for both; `json` for serde_json response parsing in the AI layer.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "charset"] }
# ZIP writing for code export (Feature 2) and generated `.penpot` files.
zip = { version = "2", default-features = false, features = ["deflate"] }
# App-data / cache config paths instead of hand-rolled %APPDATA% logic.
dirs = "5"

