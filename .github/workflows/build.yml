# Penpot Desktop — Windows Installer Build
#
# Triggers:
#   - Push a tag like v1.0.0, v1.1.0, etc. to produce a release installer.
#   - Manual trigger via GitHub UI or with `gh workflow run build.yml`.
#   - Does NOT fire on plain pushes to main — use build_script.mjs locally
#     which tags, pushes, and then CI builds the installer.
#
# What this workflow does:
#   1. Sets up the full toolchain (Java, Clojure CLI, Node.js, pnpm, Rust).
#   2. Builds the Clojure/JVM backend uberjar (penpot.jar).
#   3. Installs frontend dependencies (pnpm install in penpot-source/frontend).
#   4. Downloads portable PostgreSQL 16.4 and Redis 8.8.0 Windows binaries.
#   5. Runs `pnpm tauri build` — Tauri's beforeBuildCommand builds the
#      ClojureScript frontend; the Rust code is compiled; an NSIS installer
#      is produced with the backend JAR, frontend assets, Postgres, and Redis
#      bundled together.
#   6. Uploads the installer as a workflow artifact.
#   7. Creates a GitHub Release with the installer attached.
#
# Notes:
#   - The WASM render engine (render-wasm) is NOT built in CI because it
#     requires Emscripten 4.0.6 + pinned Rust 1.91.0. The app falls back to
#     the SVG renderer, which works fine for the desktop use-case. A stub
#     shared.js is generated automatically so the ClojureScript frontend can
#     still compile. To enable WASM rendering, add an Emscripten setup step
#     and run build_render_wasm.bat.
#   - PostgreSQL and Redis are bundled as portable binaries inside the
#     installer, matching the paths expected by src-tauri/src/lib.rs.

name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  JAVA_TOOL_OPTIONS: "-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m"

# softprops/action-gh-release needs contents: write to create the release
# from the tag push. The default GITHUB_TOKEN is read-only without this.
permissions:
  contents: write

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Toolchain ─────────────────────────────────────────────────────────

      - name: Setup Java 23
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: "1.12.0.1488"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@11.9.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ── Common module Java sources ─────────────────────────────────────────
      # app.common.UUIDv8 (penpot-source/common/src/app/common/UUIDv8.java)
      # MUST be compiled to penpot-source/common/target/classes/ BEFORE the
      # backend uberjar is built. common's deps.edn :paths includes
      # "target/classes", so the backend's b/uber pulls UUIDv8.class into
      # penpot.jar via the penpot/common {:local/root "../common"} dep — but
      # ONLY if the .class exists at uber time. target/ is gitignored, so a
      # fresh CI checkout has no UUIDv8.class; without this step the uberjar
      # ships without it and the backend dies on startup with
      # ClassNotFoundException: app.common.UUIDv8 (the frontend build needs it
      # too, via shadow-cljs). So this runs first, before the backend jar.

      - name: Compile common module Java sources (UUIDv8)
        run: |
          cd penpot-source/common
          clojure -T:build compile
          test -f target/classes/app/common/UUIDv8.class || { echo "UUIDv8.class missing after compile!"; exit 1; }
          cd ../..
        shell: bash

      # ── Backend (JVM uberjar) ─────────────────────────────────────────────
      # Built here — NOT inside Tauri's beforeBuildCommand — because compiling
      # 100+ MB of Clojure deps is slow and JVM heap-constrained.

      - name: Verify Clojure CLI
        run: clojure --version

      - name: Build backend JAR
        run: |
          cd penpot-source/backend
          clojure -T:build clean
          clojure -T:build jar
          # Regression guard: UUIDv8.class MUST be inside the uberjar, or the
          # backend will crash on startup with ClassNotFoundException. This
          # catches any future reordering that builds the jar before common
          # is compiled.
          jar tf target/penpot.jar | grep -q "app/common/UUIDv8.class" \
            || { echo "UUIDv8.class missing from penpot.jar!"; exit 1; }
          cd ../..
        shell: bash

      # ── Frontend dependencies (pnpm) ──────────────────────────────────────
      # The explicit build:penpot step below calls pnpm inside
      # penpot-source/frontend, so deps must be installed first.

      - name: Install frontend dependencies
        run: |
          cd penpot-source/frontend
          pnpm install --frozen-lockfile
          cd ../..
        shell: bash

      # ── Runtime binaries (bundled in installer) ───────────────────────────
      # The Rust side expects:
      #   tools/postgres/bin/       — PostgreSQL portable
      #   tools/redis/Redis-.../    — Redis portable
      #   tools/jre/bin/java.exe    — jlink-minimized JRE (no system Java needed)

      - name: Cache PostgreSQL, Redis, JRE, and ImageMagick binaries
        id: cache-runtime
        uses: actions/cache@v4
        with:
          path: |
            tools/postgres
            tools/redis
            tools/jre
            tools/imagemagick
          key: runtime-binaries-2026-07-jdknet-imagemagick-v2

      - name: Create minimal JRE bundle via jlink
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: |
          # JAVA_HOME is already set by setup-java above.  jlink creates a
          # stripped-down runtime image (~50 MB) with just the modules the
          # Clojure/Penpot backend needs.
          # jdk.net is REQUIRED: the Redis client (lettuce/Netty) loads
          # jdk.net.ExtendedSocketOptions at runtime; without it the backend
          # crashes during integrant init with NoClassDefFoundError:
          # jdk/net/ExtendedSocketOptions and port 3449 never opens.
          # (jdeps underreports this — reflection/SPI deps — so it's listed
          # explicitly. Don't remove it.)
          "$JAVA_HOME/bin/jlink" \
            --module-path "$JAVA_HOME/jmods" \
            --add-modules java.se,java.compiler,java.instrument,java.management.rmi,java.naming,java.rmi,java.scripting,java.sql.rowset,jdk.charsets,jdk.crypto.cryptoki,jdk.crypto.ec,jdk.httpserver,jdk.management.agent,jdk.naming.rmi,jdk.net,jdk.unsupported,jdk.xml.dom \
            --output tools/jre \
            --strip-debug --no-header-files --no-man-pages
          echo "jlink image created:"
          ls -lh tools/jre/bin/java.exe
          du -sh tools/jre/
        shell: bash

      - name: Download PostgreSQL portable (16.4)
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/postgres
          curl -fsSL -o pg.zip "https://get.enterprisedb.com/postgresql/postgresql-16.4-1-windows-x64-binaries.zip"
          unzip -q pg.zip -d _pg_extract
          # EnterpriseDB zip has a pgsql/ directory at the root
          if [ -d "_pg_extract/pgsql" ]; then
            cp -r _pg_extract/pgsql/* tools/postgres/
          elif [ -d "_pg_extract/pg16" ]; then
            cp -r _pg_extract/pg16/* tools/postgres/
          else
            echo "ERROR: unexpected PostgreSQL zip structure"
            ls -la _pg_extract/
            exit 1
          fi
          rm -rf _pg_extract pg.zip
          # Verify the critical binary exists; fail the build if missing
          test -f tools/postgres/bin/pg_ctl.exe || { echo "pg_ctl.exe not found after extraction!"; exit 1; }
          echo "PostgreSQL 16.4 extracted OK — pg_ctl.exe found"

      - name: Download Redis portable (8.8.0)
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/redis
          curl -fsSL -o redis.zip "https://github.com/redis-windows/redis-windows/releases/download/8.8.0/Redis-8.8.0-Windows-x64-msys2.zip"
          unzip -q redis.zip -d tools/redis/
          rm -f redis.zip
          test -f tools/redis/Redis-8.8.0-Windows-x64-msys2/redis-server.exe || { echo "redis-server.exe not found after extraction!"; exit 1; }
          echo "Redis 8.8.0 extracted OK — redis-server.exe found"

      - name: Download ImageMagick portable
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/imagemagick
          # Portable Q16-HDRI x64 build. The official imagemagick.org archive
          # no longer hosts Windows portable zips — /archive/binaries/ now ships
          # only MSIX + Linux tarballs + a Linux-only `magick` single binary.
          # Windows portable builds live on SourceForge now, distributed as .7z
          # (no .zip). 7z is preinstalled on GitHub Actions Windows runners.
          # If this URL rots, browse
          # https://sourceforge.net/projects/imagemagick/files/ for a newer
          # version and update the version below.
          curl -fL --retry 3 -o imagemagick.7z \
            "https://downloads.sourceforge.net/project/imagemagick/7.1.2-27/ImageMagick-7.1.2-27-portable-Q16-HDRI-x64.7z"
          7z x -y -bd imagemagick.7z -o"tools/imagemagick/" >/dev/null
          rm -f imagemagick.7z
          test -f tools/imagemagick/magick.exe || { echo "magick.exe not found after extraction!"; ls -R tools/imagemagick/; exit 1; }
          echo "ImageMagick 7.1.2-27 extracted OK — magick.exe found"

      # ── Root dependencies ──────────────────────────────────────────────────
      # Install root npm dependencies (sharp for icons, Tauri CLI for build).
      # Must run before generate-icons.mjs since it imports sharp.

      - name: Install root dependencies for Tauri CLI
        run: npm ci

      # ── Icons ─────────────────────────────────────────────────────────────
      # Generate icons explicitly before the Tauri build so they exist even
      # if Tauri validates icon paths before running beforeBuildCommand.
      # (beforeBuildCommand also generates them, so this is a belt-and-suspenders
      # approach — generating a few PNGs is fast.)

      - name: Generate app icons
        run: node scripts/generate-icons.mjs
        shell: bash

      # ── plugins-runtime (linked frontend dep) ──────────────────────────────
      # The frontend imports @penpot/plugins-runtime, a TypeScript lib linked
      # via pnpm (link:../plugins/libs/plugins-runtime) whose package.json
      # points at ./dist/index.js. dist/ is gitignored and the package lives in
      # the SEparate penpot-source/plugins pnpm workspace (own lockfile), so a
      # fresh CI checkout has neither its node_modules nor its built dist.
      # Without this, build:app:libs (esbuild bundling target/index.js) fails:
      # "Could not resolve @penpot/plugins-runtime". Install the runtime
      # package's deps (filtered — skips the angular/vitest plugin example
      # apps) and build it here.

      - name: Build @penpot/plugins-runtime
        run: |
          cd penpot-source/plugins
          pnpm install --frozen-lockfile --filter @penpot/plugins-runtime...
          pnpm build:runtime
          test -f libs/plugins-runtime/dist/index.js || { echo "plugins-runtime dist/index.js missing!"; exit 1; }
          cd ../..
        shell: bash

      # ── Frontend (ClojureScript) build ────────────────────────────────────
      # Built as an explicit step here (not inside beforeBuildCommand) so CI
      # output is transparent and failures are easy to diagnose.

      - name: Build Penpot frontend (ClojureScript)
        run: npm run build:penpot
        shell: bash

      # ── Tauri build (produces NSIS installer) ─────────────────────────────
      # beforeBuildCommand in tauri.conf.json runs just node scripts/generate-icons.mjs
      # (fast no-op since icons were already generated above).  Then Tauri
      # compiles the Rust side and packages the NSIS installer with Postgres,
      # Redis, backend JAR, and the pre-built frontend assets.
      #
      # PowerShell is used here because Git Bash shadows MSVC's link.exe with
      # Git's own /usr/bin/link.exe, which breaks Rust release builds on Windows.

      - name: Build Tauri app (NSIS installer)
        run: npm run tauri build -- --bundles nsis
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Artifacts ─────────────────────────────────────────────────────────
      # Ship ONLY the NSIS setup exe (the actual installer). The previous
      # `target/release/*.exe` glob also captured the raw penpot-desktop.exe
      # app binary, which users mistook for the installer — running it just
      # created a data folder with no window (the bundled resources live
      # elsewhere). The proper installer is bundle/nsis/*-setup.exe.

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Penpot-Desktop-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          compression-level: 0
          retention-days: 30

      - name: Upload bundle artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: Penpot-Desktop-MSBundle
          path: src-tauri/target/release/bundle/
          retention-days: 7

      # ── Release ───────────────────────────────────────────────────────────

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Penpot Desktop ${{ github.ref_name }}
          body: |
            ## Penpot Desktop ${{ github.ref_name }}

            Windows installer for Penpot Desktop — a fully offline, native
            design tool powered by the real Penpot ClojureScript frontend and
            Clojure/JVM backend.

            ### What's included
            - Full Penpot UI (ClojureScript SPA)
            - Penpot JVM backend
            - Local PostgreSQL 16.4 + Redis 8.8.0 (embedded)
            - ImageMagick 7.1.2 (embedded; required for thumbnails and media processing)
            - SVG renderer (WASM WebGL renderer available with manual build)
            - Minimal JRE for Java 23 (bundled via jlink)

            ### Installation
            Download `Penpot Desktop_*_x64-setup.exe` and run it. No
            prerequisites required — PostgreSQL, Redis, and Java JRE are all
            bundled. This is the NSIS installer (Start Menu + Desktop
            shortcuts, uninstaller); it is NOT the raw app binary.
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
